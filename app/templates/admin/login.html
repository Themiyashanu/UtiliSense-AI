<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Utility AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="auth-bg">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card auth-card border-0">
                <div class="card-body p-4 p-md-5">
                    <h3 class="text-center mb-2"><i class="bi bi-shield-lock-fill text-primary"></i> Admin Portal</h3>
                    <p class="text-center text-muted mb-4">Authorized admin credentials required</p>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                    {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }}">{{ msg }}</div>
                    {% endfor %}
                    {% endif %}
                    {% endwith %}
                    <form method="post" action="{{ url_for('admin.login') }}" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Admin Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login as Admin</button>
                    </form>
                    <p class="text-center mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to user login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
